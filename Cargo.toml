[workspace]
members = [
  "crates/hdk",
  "crates/holochain_nonce",
  "crates/holochain_zome_types",
]

resolver = "2"

[workspace.package]
version = "0.9.0-dev.0"
authors = ["Holochain Core Dev Team <devcore@holochain.org>"]
homepage = "https://www.holochain.org/"
repository = "https://github.com/holochain/holochain-hdk"
edition = "2021"

[workspace.dependencies]
# Workspace crates. See the note in holochain-hdi about default-features.
holochain_nonce = { version = "0.9.0-dev.0", path = "crates/holochain_nonce" }
holochain_zome_types = { version = "0.9.0-dev.0", path = "crates/holochain_zome_types", default-features = false }

# Published HDI crate group (https://github.com/holochain/holochain-hdi).
# `hdi` is pinned exactly because a hApp must compile the HDK and the HDI
# against the same integrity types.
fixt = "0.9.0-dev.4"
hdi = "=0.9.0-dev.4"
hdk_derive = "0.9.0-dev.4"
holo_hash = "0.9.0-dev.4"
holochain_integrity_types = "0.9.0-dev.4"
holochain_secure_primitive = { version = "0.9.0-dev.4", default-features = false }
holochain_timestamp = "0.9.0-dev.4"

[workspace.lints.clippy]
nursery = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
restriction = { level = "allow", priority = -1 }
style = "deny"
complexity = "deny"
perf = "deny"
correctness = "deny"
dbg_macro = "deny"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.release]
opt-level = "z"

# Local development against an unpublished holochain-hdi checkout.
# Uncomment as needed; never commit uncommented entries.
[patch.crates-io]
# fixt = { path = "../holochain-hdi/crates/fixt" }
# hdi = { path = "../holochain-hdi/crates/hdi" }
# hdk_derive = { path = "../holochain-hdi/crates/hdk_derive" }
# holo_hash = { path = "../holochain-hdi/crates/holo_hash" }
# holochain_integrity_types = { path = "../holochain-hdi/crates/holochain_integrity_types" }
# holochain_secure_primitive = { path = "../holochain-hdi/crates/holochain_secure_primitive" }
# holochain_timestamp = { path = "../holochain-hdi/crates/timestamp" }
# holochain_util = { path = "../holochain-hdi/crates/holochain_util" }
